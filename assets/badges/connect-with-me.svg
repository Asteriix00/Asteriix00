<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10002B"/>
      <stop offset="55%" stop-color="#3C096C"/>
      <stop offset="100%" stop-color="#5A189A"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0AAFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.03"/>
    </pattern>

    <clipPath id="roundedClip">
      <rect x="4" y="4" width="892" height="182" rx="14"/>
    </clipPath>
  </defs>

  <!-- background -->
  <g clip-path="url(#roundedClip)">
    <rect x="4" y="4" width="892" height="182" fill="url(#bg)"/>
    <rect x="4" y="4" width="892" height="182" fill="url(#scanlines)"/>

    <!-- corner pixel decorations (top rail, like a game HUD) -->
    <g fill="#C77DFF" opacity="0.55">
      <rect x="24" y="20" width="8" height="8"/>
      <rect x="36" y="20" width="8" height="8"/>
      <rect x="24" y="32" width="8" height="8"/>
    </g>
    <g fill="#C77DFF" opacity="0.55">
      <rect x="868" y="20" width="8" height="8"/>
      <rect x="856" y="20" width="8" height="8"/>
      <rect x="868" y="32" width="8" height="8"/>
    </g>
  </g>

  <!-- pixel-style border, double frame like an 8-bit dialog box -->
  <rect x="4" y="4" width="892" height="182" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  <rect x="12" y="12" width="876" height="166" rx="10" fill="none" stroke="#9D4EDD" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>

  <!-- pixel trophy icon, left -->
  <g transform="translate(70,72)" fill="#FFD60A" filter="url(#glow)">
    <rect x="8" y="0" width="24" height="6"/>
    <rect x="4" y="6" width="32" height="6"/>
    <rect x="4" y="12" width="8" height="6"/>
    <rect x="28" y="12" width="8" height="6"/>
    <rect x="10" y="18" width="20" height="10"/>
    <rect x="16" y="28" width="8" height="6"/>
    <rect x="10" y="34" width="20" height="6"/>
    <rect x="0" y="6" width="4" height="10" fill="#FFC300"/>
    <rect x="36" y="6" width="4" height="10" fill="#FFC300"/>
  </g>

  <!-- pixel controller icon, right -->
  <g transform="translate(796,78)" fill="#E0AAFF" filter="url(#glow)">
    <rect x="0" y="8" width="48" height="16"/>
    <rect x="6" y="2" width="10" height="6"/>
    <rect x="32" y="2" width="10" height="6"/>
    <rect x="-4" y="12" width="6" height="8"/>
    <rect x="46" y="12" width="6" height="8"/>
    <rect x="10" y="10" width="4" height="4" fill="#3C096C"/>
    <rect x="6" y="14" width="4" height="4" fill="#3C096C"/>
    <rect x="14" y="14" width="4" height="4" fill="#3C096C"/>
    <rect x="34" y="12" width="4" height="4" fill="#FFD60A"/>
    <rect x="40" y="16" width="4" height="4" fill="#FFD60A"/>
  </g>

  <!-- the quote -->
  <text x="450" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="url(#quoteGrad)" filter="url(#glow)">
    "LET'S BUILD SOMETHING GREAT TOGETHER"
  </text>

  <!-- Player 2 line -->
  <text x="450" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#C77DFF" opacity="0.75">PLAYER 2 HAS JOINED THE SESSION</text>

  <!-- progress bar (placed BELOW the Player 2 line) -->
  <g transform="translate(350,145)">
    <rect x="0" y="0" width="200" height="6" fill="#3C096C" stroke="#9D4EDD" stroke-width="1"/>
    <rect x="1" y="1" width="198" height="4" fill="#9D4EDD"/>
    <rect x="1" y="1" width="198" height="4" fill="#C77DFF">
      <animate attributeName="width" values="0;198;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
