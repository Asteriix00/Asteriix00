<svg width="340" height="80" viewBox="0 0 340 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#3C096C"/>
    </linearGradient>
    <linearGradient id="borderMM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
    <filter id="glowMM" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="334" height="74" rx="10" fill="url(#bgMM)" stroke="url(#borderMM)" stroke-width="2.5"/>
  <rect x="9" y="9" width="322" height="62" rx="7" fill="none" stroke="#FFC300" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>

  <!-- pixel flag icon -->
  <g transform="translate(28,20)" fill="#FFD60A" filter="url(#glowMM)">
    <rect x="0" y="0" width="4" height="40"/>
    <rect x="4" y="4" width="22" height="6"/>
    <rect x="4" y="10" width="26" height="6"/>
    <rect x="4" y="16" width="18" height="6"/>
  </g>

  <text x="185" y="39" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#FFD60A" filter="url(#glowMM)">MAIN MISSION</text>
  <text x="185" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="4" fill="#FFC300" opacity="0.7">PRIMARY OBJECTIVE</text>
</svg>
