name: player-stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate player-stats.svg
        run: python scripts/generate_player_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/player-stats.svg
          git diff --staged --quiet || git commit -m "chore: update player-stats.svg"
          git push
